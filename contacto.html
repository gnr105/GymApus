    <div class="contenido">
        <h2>Formulario de Contacto</h2>
        <form id="contactForm">
          <input type="text" name="nombre" placeholder="Nombre completo" required />
          <input type="email" name="email" placeholder="Correo electrónico" required />
          <input type="tel" name="telefono" placeholder="Teléfono" pattern="[0-9+ ]{7,}" required />
          <select name="motivo" required>
            <option value="">Seleccioná un motivo</option>
            <option value="consulta">Consulta</option>
            <option value="soporte">Soporte</option>
            <option value="otros">Otros</option>
          </select>
          <textarea name="mensaje" placeholder="Escribí tu mensaje..." required></textarea>
          <button type="submit">
            Enviar
            <span class="spinner"></span>
          </button>
        </form>
      </div>
    
      <div class="modal" id="modal">
        <div class="modal-content">
          <h3>✅ ¡Formulario enviado con éxito!</h3>
          <p>Gracias por contactarte. Te responderemos pronto.</p>
        </div>
      </div>
