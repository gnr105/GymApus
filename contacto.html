<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/GymApus/css/style.css">
    <link rel="stylesheet" href="/GymApus/css/contacto.css">
    
    <title>Contacto</title>
    <link rel = "shortcut icon" href="/GymApus/imagenes/APU´S.ico">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="logo">
              <a href="/GymApus/inicio.html"><img src="/GymApus/imagenes/APU´S.png" alt=""></a>
            </div>
            
            <div class="dropdown" style="float:right;">
                    <button class="dropbtn"><img src="/GymApus/imagenes/menu-regular-24.png" alt=""></button>
                    <div class="dropdown-content">
                        <a href="/GymApus/inicio.html">INICIO</a>
                        <a href="/GymApus/clases.html">CLASES</a>
                        <a href="/GymApus/entrenador.html">ENTRENADOR</a>
                        <a href="/GymApus/precios.html">PRECIOS</a>
                        <a href="/GymApus/blog.html">BLOG</a>
                        <a href="/GymApus/contacto.html">CONTACTO</a>    
                    </div>
            </div> 
             
        </div>
    </header>
    <div class="contenido">
        <h2>Formulario de Contacto</h2>
        <form id="contactForm">
          <input type="text" name="nombre" placeholder="Nombre completo" required />
          <input type="email" name="email" placeholder="Correo electrónico" required />
          <input type="tel" name="telefono" placeholder="Teléfono" pattern="[0-9+ ]{7,}" required />
          <select name="motivo" required>
            <option value="">Seleccioná un motivo</option>
            <option value="consulta">Consulta</option>
            <option value="soporte">Soporte</option>
            <option value="otros">Otros</option>
          </select>
          <textarea name="mensaje" placeholder="Escribí tu mensaje..." required></textarea>
          <button type="submit">
            Enviar
            <span class="spinner"></span>
          </button>
        </form>
      </div>
    
      <div class="modal" id="modal">
        <div class="modal-content">
          <h3>✅ ¡Formulario enviado con éxito!</h3>
          <p>Gracias por contactarte. Te responderemos pronto.</p>
        </div>
      </div>
      <script src="/GymApus/javascript/contacto.js"></script>
</body>
</html>
